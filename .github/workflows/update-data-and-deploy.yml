name: Update Rift Lab data and deploy

on:
  workflow_dispatch:
    inputs:
      backfill:
        description: Recover complete historical ranked match data
        required: false
        type: boolean
        default: false
      continue_refresh_loop:
        description: Continue the five-minute live refresh loop
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ ((github.event_name == 'workflow_dispatch' && inputs.backfill) || contains(github.event.head_commit.message, '[backfill-data]')) && 'backfill' || 'refresh' }}
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Start refresh interval
        id: refresh-interval
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || contains(github.event.head_commit.message, '[backfill-data]')
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Riot data
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || contains(github.event.head_commit.message, '[backfill-data]')
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          HISTORY_START_YEAR: 2022
          HISTORICAL_MATCH_COUNT_PER_QUEUE: 20
          ENRICH_MISSING_MATCH_LIMIT: 160
          RIOT_REQUEST_DELAY_MS: 1250
          HISTORICAL_BACKFILL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.backfill) || contains(github.event.head_commit.message, '[backfill-data]')) && 'true' || 'false' }}
        run: npm run update:data

      - name: Backfill every ranked match in each season
        if: (github.event_name == 'workflow_dispatch' && inputs.backfill) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[backfill-data]'))
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          HISTORY_START_YEAR: 2022
          RIOT_REQUEST_DELAY_MS: 1250
        run: node scripts/backfill-season-matches.mjs

      - name: Record LP history
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]') || contains(github.event.head_commit.message, '[backfill-data]')
        run: node scripts/update-lp-history.mjs

      - name: Reuse deployed data for code push
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-data]') && !contains(github.event.head_commit.message, '[backfill-data]')
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --retry-delay 2 \
            --output data/rift-lab.json \
            "https://gennnnnnnnn.github.io/a1esports/data/rift-lab.json?sha=${{ github.sha }}"

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html players.html coach.html dist/
          cp -R css js data dist/
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wait for the next refresh interval
        if: success() && !((github.event_name == 'workflow_dispatch' && inputs.backfill) || contains(github.event.head_commit.message, '[backfill-data]')) && (github.event_name != 'workflow_dispatch' || inputs.continue_refresh_loop)
        env:
          STARTED_AT: ${{ steps.refresh-interval.outputs.started_at }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          remaining=$(( 300 - elapsed ))
          if [ "$remaining" -gt 0 ]; then
            sleep "$remaining"
          fi

      - name: Continue live refresh loop
        if: success() && !((github.event_name == 'workflow_dispatch' && inputs.backfill) || contains(github.event.head_commit.message, '[backfill-data]')) && (github.event_name != 'workflow_dispatch' || inputs.continue_refresh_loop)
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "update-data-and-deploy.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: { continue_refresh_loop: "true" }
            });
